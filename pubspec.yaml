name: csi_gatekeeper
description: Fail-closed CSI controller gateway for a dedicated democratic-csi backend.
version: 0.1.0
publish_to: none
environment:
  sdk: ">=3.13.0 <4.0.0"
dependencies:
  grpc: 5.1.0
  protobuf: 6.1.0
  fixnum: 1.1.1
  crypto: 3.0.7
dev_dependencies:
  legal: ^0.2.2
  melos: 8.9.0
  protoc_plugin: 25.1.0
  test: 1.32.0

melos:
  useRootAsPackage: true
  scripts:
    format: dart format bin lib test tool
    format:check: dart format --output=none --set-exit-if-changed bin lib test tool
    analyze: dart analyze
    test: dart test
    release:package: dart run tool/package_release.dart
    build: dart run tool/build.dart
  command:
    version:
      branch: main
      workspaceChangelog: false
      fetchTags: false
      hooks:
        preCommit: |
          dart run tool/sync_version.dart
          dart pub get --offline
          git add lib/src/version.dart pubspec.lock

legal:
  include_sdk: true
  policy: permissive
  unknown: deny
  # packages:
  #   overrides:
  #     grpc:
  #       versions: '5.1.0'
  #       expression: Apache-2.0
  #       reason: 'Reviewed LICENSE: Apache-2.0 sections 1-9 match; optional application appendix is omitted.'
